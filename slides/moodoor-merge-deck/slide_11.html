<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #1A1714;
            color: #F9F7F4;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-left: 100px;
            padding-right: 100px;
        }
        .accent-line {
            width: 80px;
            height: 2px;
            background-color: #4A6741;
            margin-bottom: 48px;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 72px;
            font-weight: 300;
            line-height: 1.1;
            color: #F9F7F4;
            margin-bottom: 24px;
            letter-spacing: -0.01em;
        }
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 400;
            font-style: italic;
            color: #C9A84C;
            margin-bottom: 80px;
        }
        .footer-brand {
            font-size: 16px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #A8A8A8;
        }
        .footer-brand span {
            color: #C9A84C;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-line"></div>
        <h1>Moodoor makes selection feel considered.</h1>
        <h2>Private craft. Public clarity.</h2>
        
        <div class="footer-brand">
            Moodoor Studio <span>×</span> Everfracted
        </div>
    </div>
</body>
</html>
